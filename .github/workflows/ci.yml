name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    VITEST_MAX_THREADS: '16'
    VITEST_MIN_THREADS: '4'

jobs:
    lint:
        runs-on: win-main
        timeout-minutes: 10
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

            - name: Check Prettier formatting
              run: pnpm exec prettier --check . --config config/.prettierrc

    test:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: win-parallel-1
                      test-type: unit
                    - runner: win-parallel-2
                      test-type: integration
                    - runner: win-parallel-3
                      test-type: edge

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ${{ matrix.test-type }} Tests
              run: pnpm run test:bun:${{ matrix.test-type }}

    build:
        runs-on: win-main
        timeout-minutes: 15
        needs: [lint, test]
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build check
              shell: pwsh
              run: |
                  $pkg = Get-Content package.json -Raw | ConvertFrom-Json
                  if ($null -ne $pkg.scripts -and $null -ne $pkg.scripts.build) {
                    pnpm build
                  } else {
                    Write-Host "No build script defined - skipping"
                  }

    notify:
        runs-on: win-main
        needs: [lint, test, build]
        if: always()

        steps:
            - name: Success notification
              if: needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'
              run: echo "✅ All checks passed!"

            - name: Failure notification
              if: needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure'
              run: |
                  echo "❌ CI Failed!"
                  echo "Check the logs above for details."
                  exit 1
