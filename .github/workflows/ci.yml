name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    # Enable parallel execution
    VITEST_MAX_THREADS: '16'
    VITEST_MIN_THREADS: '4'

jobs:
    lint:
        runs-on: self-hosted-windows11
        timeout-minutes: 10
        fail-fast: false

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

            - name: Check Prettier formatting
              run: pnpm exec prettier --check . --config config/.prettierrc

    test-unit:
        runs-on: self-hosted-windows11
        timeout-minutes: 30
        fail-fast: false

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Unit Tests
              run: pnpm run test:bun:unit

    test-integration:
        runs-on: self-hosted-windows11
        timeout-minutes: 30
        fail-fast: false

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Integration Tests
              run: pnpm run test:bun:integration

    test-edge:
        runs-on: self-hosted-windows11
        timeout-minutes: 30
        fail-fast: false

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Edge Case Tests
              run: pnpm run test:bun:edge

    build:
        runs-on: self-hosted-windows11
        timeout-minutes: 15
        needs: [lint, test-unit, test-integration, test-edge]
        fail-fast: false

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  dest: ${{ runner.temp }}\setup-pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build check
              shell: pwsh
              run: |
                  $pkg = Get-Content package.json -Raw | ConvertFrom-Json
                  if ($null -ne $pkg.scripts -and $null -ne $pkg.scripts.build) {
                    pnpm build
                  } else {
                    Write-Host "No build script defined - skipping"
                  }

    notify:
        runs-on: self-hosted-windows11
        needs: [lint, test-unit, test-integration, test-edge, build]
        if: always()

        steps:
            - name: Success notification
              if: needs.lint.result == 'success' && needs.test-unit.result == 'success' && needs.test-integration.result == 'success' && needs.test-edge.result == 'success' && needs.build.result == 'success'
              run: echo "✅ All checks passed!"

            - name: Failure notification
              if: needs.lint.result == 'failure' || needs.test-unit.result == 'failure' || needs.test-integration.result == 'failure' || needs.test-edge.result == 'failure' || needs.build.result == 'failure'
              run: |
                  echo "❌ CI Failed!"
                  echo "Check the logs above for details."
                  exit 1
