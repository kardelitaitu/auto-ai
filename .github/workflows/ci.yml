name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    # VITEST_MAX_THREADS and VITEST_MIN_THREADS removed to use maximum parallelism (cpuCount - 2)

jobs:
    lint:
        runs-on: self-hosted-windows11

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                dest: ${{ runner.temp }}\setup-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

    test-unit:
        runs-on: self-hosted-windows11

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                dest: ${{ runner.temp }}\setup-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Unit Tests
              run: pnpm run test:bun:unit

    test-integration:
        runs-on: self-hosted-windows11

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                dest: ${{ runner.temp }}\setup-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Integration Tests
              run: pnpm run test:bun:integration

    test-edge:
        runs-on: self-hosted-windows11

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                dest: ${{ runner.temp }}\setup-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Edge Case Tests
              run: pnpm run test:bun:edge

    build:
        runs-on: self-hosted-windows11
        needs: [lint, test-unit, test-integration, test-edge]

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                dest: ${{ runner.temp }}\setup-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build check
              shell: bash
              run: |
                  if grep -q '"build":' package.json; then
                    pnpm build
                  else
                    echo "No build script defined - skipping"
                  fi

    notify:
        runs-on: self-hosted-windows11
        needs: [lint, test-unit, test-integration, test-edge, build]
        if: always()

        steps:
            - name: Success notification
              if: needs.lint.result == 'success' && needs.test-unit.result == 'success' && needs.test-integration.result == 'success' && needs.test-edge.result == 'success' && needs.build.result == 'success'
              run: echo "✅ All checks passed!"

            - name: Failure notification
              if: needs.lint.result == 'failure' || needs.test-unit.result == 'failure' || needs.test-integration.result == 'failure' || needs.test-edge.result == 'failure' || needs.build.result == 'failure'
              run: |
                  echo "❌ CI Failed!"
                  echo "Check the logs above for details."
                  exit 1
